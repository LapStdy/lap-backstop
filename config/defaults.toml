# 内核默认值：唯一真源（docs/11 配置一节）。
# 业务配置（调度、模板、插件配置、通知）存数据库 settings 表；这里是代码内置默认值与范围的基线。

[worker]
deadline_minutes = 30
max_observations = 10
call_timeout_seconds = 300
start_timeout_seconds = 15
cancel_grace_seconds = 5
max_restarts = 3
degraded_retry_seconds = 300

[recovery]
max_attempts = 3
backoff_seconds = [30, 120, 300]

[leases]
default_ttl_seconds = 600
renew_interval_seconds = 60
recover_delay_seconds = 60

[storage]
busy_timeout_ms = 5000

[host]
heartbeat_interval_seconds = 60
stale_seconds = 300
acceptance_seconds = 120
give_up_window_minutes = 30
give_up_max_failures = 3
# 启动校时后允许的墙钟偏移上限（秒）；超过记 host.clock_skew 并暂停补跑（docs/08）。
clock_skew_seconds = 30
# 运行中墙钟相对单调时钟的跳变上限（秒）；超过记 host.suspended，全环境置 unknown 并 probe（docs/08）。
clock_jump_seconds = 120

[scheduler]
timezone = "Asia/Shanghai"
catch_up = "run_once"
window_minutes = 120
coalesce = true
priority = 0
deadline_minutes = 180
preheat_minutes = 0
keep_warm_minutes = 0

[api]
# 远程监听开关：为 true 时启动阶段探测 Tailscale 并追加 tailnet 地址（docs/08）。
remote_enabled = false

[notify]
# 外部通知渠道；enabled=false 时其余键不生效也不校验（缺省关闭不报错，docs/06）。
# token 对 ServerChan 是 SendKey、对钉钉是加签密钥、对 ntfy 是访问令牌。
# webhook 供钉钉机器人使用；url 供 ntfy 主题地址使用，也可覆盖 ServerChan 官方接口。
# enabled: bool；channel: serverchan/dingtalk/ntfy；timeout_seconds: 秒，>0；
# attempts: 总尝试次数，≥1；backoff_seconds: 秒序列，每项 ≥0；use_proxy: bool。
# heartbeat_url: dead-man 外部 Push 服务地址（docs/08 外部报警）；空串不启用。
enabled = false
channel = "serverchan"
timeout_seconds = 10
attempts = 3
backoff_seconds = [5, 30]
use_proxy = false
heartbeat_url = ""

[backup]
# 证据增量镜像的体积阈值（GB）：证据根总量超过时只搬 verdict 引用到的证据（docs/08 备份与恢复）。
evidence_mirror_threshold_gb = 20

[retention]
# 每日本地执行时刻（HH:MM），时区取 scheduler.timezone；到点后的第一个 tick 执行一次。
daily_at = "03:30"
# 终态运行的证据文件保留天数；文件删除后 evidence 行保留到 90 天整棵清理。
evidence_days = 30
# 证据根总字节上限（GB）；超过时按 evidence.created_at 从旧到新删终态运行的文件。
evidence_total_gb = 20
# 运行事件与阶段行的保留天数，只作用于终态运行。
run_records_days = 30
# 判定、运行行及其外键子行的保留天数，只作用于终态运行。
verdicts_days = 90
# 原始日志文件（core-YYYY-MM-DD[.N].jsonl）的保留天数，按 UTC 日界。
logs_days = 14
# 压缩日志文件（.jsonl.gz）的保留天数，按 UTC 日界。
logs_archive_days = 90
# advisor_calls 行的保留天数。
advisor_days = 90
