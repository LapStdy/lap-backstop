[project]
name = "lap-backstop"
version = "0.1.0"
description = "Windows 上的调度与监督平台：按时触发、就绪才执行、验证结果、失败恢复"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["contracts", "core", "plugins", "web", "storage", "tests"]
extend-exclude = ["archive", ".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文文档与注释使用全角标点，属于有意为之。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501", "E702", "SIM105", "UP009", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "core", "plugins", "storage", "web"]

[tool.mypy]
python_version = "3.12"
files = ["contracts", "core", "storage", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
